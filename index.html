<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScienceHub - Premium AI Intelligence</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(45deg, #0e122b, #1e90ff, #0a0a0a, #4a00e0);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            animation: float 12s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(30, 144, 255, 0.3);
            top: 10%;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(74, 0, 224, 0.2);
            top: 50%;
            right: -150px;
            animation-delay: -5s;
        }

        @keyframes float {
            100% {
                transform: translateY(60px) translateX(-40px);
            }
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            background: linear-gradient(120deg, #1e90ff, #00d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Profile Dropdown */
        .profile-menu {
            position: relative;
            display: inline-block;
        }

        .profile-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            transition: 0.3s;
            object-fit: cover;
        }

        .profile-icon:hover {
            border-color: #1e90ff;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 55px;
            background-color: rgba(20, 20, 30, 0.95);
            min-width: 180px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            z-index: 9999;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 15px;
            transition: 0.2s;
        }

        .dropdown-content a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .show {
            display: block;
        }

        .nav-links a {
            margin-left: 25px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .signup-btn {
            padding: 10px 22px;
            background: linear-gradient(120deg, #1e90ff, #4a00e0);
            color: white !important;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.3);
            border: none;
            font-weight: 600;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 144, 255, 0.5);
        }

        /* Create Button */
        .create-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            margin-right: 15px;
        }

        .create-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 120px 20px 80px;
            position: relative;
            z-index: 10;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .hero h1 span {
            background: linear-gradient(120deg, #1e90ff, #00d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 300;
        }

        /* CARDS SECTION - Horizontal Scroll */
        .cards {
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 30px;
            padding: 30px 60px 80px;
            position: relative;
            z-index: 10;
            scrollbar-width: thin;
            scrollbar-color: rgba(30, 144, 255, 0.5) transparent;
            scroll-snap-type: x mandatory;
        }

        .cards::-webkit-scrollbar {
            height: 10px;
        }

        .cards::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .cards::-webkit-scrollbar-thumb {
            background: rgba(30, 144, 255, 0.5);
            border-radius: 10px;
        }

        .card {
            width: 340px;
            flex: 0 0 auto;
            scroll-snap-align: center;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.02) translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(30, 144, 255, 0.5);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.85;
            transition: 0.4s;
        }

        .card:hover img {
            opacity: 1;
        }

        .card-content {
            padding: 25px;
        }

        .card-content h3 {
            margin-bottom: 12px;
            font-size: 22px;
            font-weight: 600;
        }

        .card-content p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            line-height: 1.5;
        }

        /* REVIEW SECTION */
        .review-section {
            display: none;
            /* Hidden by default */
            margin: 0 auto 80px;
            max-width: 650px;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
        }

        .review-section h2 {
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 600;
        }

        .reviewForm select,
        .reviewForm textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .reviewForm select option {
            background: #0e122b;
            color: white;
        }

        .reviewForm textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .reviewForm select:focus,
        .reviewForm textarea:focus {
            border-color: #1e90ff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.2);
        }

        /* Footer margin */
        .footer {
            height: 100px;
        }

        @media(max-width: 900px) {
            .hero h1 {
                font-size: 42px;
            }

            .cards {
                padding: 30px;
                gap: 20px;
            }

            .navbar {
                padding: 15px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- NAVBAR -->
    <div class="navbar glass-panel">
        <a href="/" style="text-decoration: none;">
            <div class="logo">Fix<span>First</span></div>
        </a>
        <div class="nav-links" style="display: flex; align-items: center;">
            <div class="profile-menu" id="auth-ui" style="display: flex; align-items: center;">
                <!-- API dynamically injects content here -->
            </div>
        </div>
    </div>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Explore Science <br><span>with AI Intelligence</span></h1>
        <p>
            Discover comprehensive knowledge across Medical Science with AI-powered insights.
        </p>
    </section>

    <!-- CARDS SECTION -->
    <section class="cards">
        <a href="lp.html">
            <div class="card glass-panel">
                <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
                    alt="Medical">
                <div class="card-content">
                    <h3>Medical Science</h3>
                    <p>Interact with our AI to get healthcare insights, symptom analysis, and wellness guidance.</p>
                </div>
            </div>
        </a>

    </section>

    <!-- REVIEW SECTION -->
    <section id="reviewSection" class="review-section glass-panel">
        <h2>Post an Insight to the Community</h2>
        <form id="reviewForm" class="reviewForm">
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <select id="reviewCategory" style="flex: 1; margin-bottom: 0;">
                    <option value="medical">Medical Science</option>
                </select>
                <select id="subCategory" style="flex: 1; margin-bottom: 0;">
                    <option value="General Medical">General Medical</option>
                    <option value="Heart / Cardiology">Heart / Cardiology</option>
                    <option value="Lungs / Pulmonology">Lungs / Pulmonology</option>
                    <option value="Bones / Orthopedics">Bones / Orthopedics</option>
                    <option value="Brain / Neurology">Brain / Neurology</option>
                    <option value="Skin / Dermatology">Skin / Dermatology</option>
                    <option value="Stomach / Gastroenterology">Stomach / Gastroenterology</option>
                    <option value="Blood / Hematology">Blood / Hematology</option>
                </select>
            </div>
            <textarea id="reviewContent" required
                placeholder="Share a recent breakthrough or personal review of our AI models..." rows="5"></textarea>
            <button type="submit" class="signup-btn"
                style="width: 100%; border-radius: 12px; font-size: 18px; padding: 15px;">Publish Insight</button>
        </form>
    </section>

    <script>
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const category = document.getElementById('reviewCategory').value;
            const subCategory = document.getElementById('subCategory').value;
            const content = document.getElementById('reviewContent').value;
            const btn = e.target.querySelector('button');

            const originalText = btn.innerText;
            btn.innerText = 'Publishing...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, subCategory, content })
                });

                const data = await res.json();
                if (res.ok) {
                    btn.innerText = 'Success!';
                    btn.style.background = '#2ed573';
                    setTimeout(() => {
                        document.getElementById('reviewContent').value = '';
                        btn.innerText = originalText;
                        btn.style.background = '';
                        btn.disabled = false;
                        toggleReviewSection(); // optionally hide after publish
                    }, 2000);
                } else {
                    alert(data.error || 'Failed to post review');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('An error occurred. Please try again.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

    <script>
        // Toggle Review Form Visibility
        function toggleReviewSection() {
            const section = document.getElementById("reviewSection");
            if (section) {
                if (section.style.display === "block") {
                    section.style.display = "none";
                } else {
                    section.style.display = "block";
                    // Scroll down to the newly revealed form smoothly
                    section.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }
        }

        // Profile Dropdown Toggle
        function toggleDropdown() {
            document.getElementById("profileDropdown").classList.toggle("show");
        }

        // Close dropdown when clicking outside
        window.onclick = function (event) {
            // Check if what was clicked was the icon or its children (for svgs)
            if (!event.target.closest('.profile-icon')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>

    <div class="footer"></div>

    <!-- User Auth API Script -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const authUi = document.getElementById('auth-ui');
                const reviewSection = document.getElementById('reviewSection');

                if (data.logged_in) {
                    const avatarSrc = data.profile_pic ? data.profile_pic : `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name || 'User')}&background=1e90ff&color=fff&rounded=true`;
                    authUi.innerHTML = `
                        <button class="create-btn" onclick="toggleReviewSection()">
                            <span style="font-size: 20px; line-height: 1;">+</span> Create
                        </button>
                        <img src="${avatarSrc}" alt="Profile" class="profile-icon" onclick="toggleDropdown()">
                        <div id="profileDropdown" class="dropdown-content">
                            <a href="profile.html">Profile</a>
                            <a href="logout.html">Logout</a>
                        </div>
                    `;
                } else {
                    if (reviewSection) reviewSection.style.display = 'none'; // Ensure review section is hidden
                    authUi.innerHTML = `
                        <svg class="profile-icon" onclick="toggleDropdown()" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="background: rgba(255,255,255,0.05); padding: 5px;">
                            <circle cx="12" cy="8" r="5"></circle>
                            <path d="M20 21a8 8 0 0 0-16 0"></path>
                        </svg>
                        <div id="profileDropdown" class="dropdown-content">
                            <a href="login.html">Login</a>
                            <a href="register.html">Create Account</a>
                        </div>
                    `;
                }
            } catch (e) {
                console.error("Auth API failed:", e);
                // Fallback UI in case of error
                document.getElementById('auth-ui').innerHTML = `
                        <svg class="profile-icon" onclick="toggleDropdown()" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="background: rgba(255,255,255,0.05); padding: 5px;">
                            <circle cx="12" cy="8" r="5"></circle>
                            <path d="M20 21a8 8 0 0 0-16 0"></path>
                        </svg>
                        <div id="profileDropdown" class="dropdown-content">
                            <a href="login.html">Login</a>
                            <a href="register.html">Create Account</a>
                        </div>
                `;
            }
        });
    </script>
</body>

</html>
