<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ScienceHub</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #0e122b, #1e90ff, #0d1b2a, #4a00e0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating Orbs for Premium feel */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(30, 144, 255, 0.4);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(74, 0, 224, 0.3);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            100% {
                transform: translateY(40px) translateX(30px);
            }
        }

        .auth-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-container h2 {
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-container h2 span {
            background: linear-gradient(120deg, #1e90ff, #00d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-group input:focus {
            border-color: #1e90ff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(120deg, #1e90ff, #4a00e0);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(30, 144, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-20deg);
            transition: left 0.5s;
        }

        .submit-btn:hover::after {
            left: 150%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(30, 144, 255, 0.5);
        }

        .switch-text {
            margin-top: 25px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
        }

        .switch-text a {
            color: #1e90ff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .switch-text a:hover {
            color: #fff;
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(30, 144, 255, 0.5);
        }

        .error-msg {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 71, 87, 0.3);
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        /* Floating Logo back to home */
        .home-btn {
            position: absolute;
            top: 30px;
            left: 40px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            transition: 0.3s;
            opacity: 0.7;
        }

        .home-btn:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        .home-btn span {
            color: #1e90ff;
        }
    </style>
</head>

<body>

    <a href="/" class="home-btn">&larr; Fix<span>First</span></a>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="auth-container">
        <h2>Welcome Back to Fix<span>First</span></h2>
        <div id="error-msg" class="error-msg"></div>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@gmail.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
            <p class="switch-text">New to FixFirst? <a href="/register">Create an account</a></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Authenticating...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    submitBtn.innerText = 'Success!';
                    submitBtn.style.background = '#2ed573';
                    setTimeout(() => window.location.href = '/', 600);
                } else {
                    errorMsg.innerText = data.error || 'Invalid credentials';
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Sign In';
                }
            } catch (err) {
                console.error(err);
                if (err instanceof TypeError || err.message.includes('fetch')) {
                    errorMsg.innerText = 'Network error. Ensure your Flask server is running at http://localhost:5000';
                } else if (err instanceof SyntaxError) {
                    errorMsg.innerText = 'Server returned an invalid response. Ensure you are not viewing this file directly from the filesystem.';
                } else {
                    errorMsg.innerText = 'An error occurred: ' + err.message;
                }
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
            }
        });
    </script>

</body>

</html>
